name: Build fork wheel

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        run: pip install uv

      - name: Install build dependencies
        run: uv pip install --system maturin setuptools

      - name: Build wheel
        run: make build-wheel

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-trader-fork-wheel
          path: dist/*.whl
          retention-days: 90

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-latest
          name: Fork latest wheel
          files: dist/*.whl
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}